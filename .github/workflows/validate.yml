name: validate

on:
  pull_request:
  push:
    branches: [main]
  # A release left behind by a rate limit or a cancelled run is published by
  # re-running this on main. The plan is read from the tag list, so a manual run
  # picks up exactly what is missing and needs no empty commit to trigger it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: manifests and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Schema, manifest drift, plugin-tree hygiene, skill portability, and links
      # in both directions — resolvable targets, and no bundled file left stranded.
      - name: Run repository checks
        run: npm run check

      - name: Run script tests
        run: npm test

      # Claude Code is the strictest manifest reader of the three; --strict turns
      # unrecognized and misspelled fields into errors instead of warnings.
      - name: Validate manifests with Claude Code
        run: |
          shopt -s nullglob
          dirs=(plugins/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no plugins yet — nothing to validate"
            exit 0
          fi
          for dir in "${dirs[@]}"; do
            npx --yes @anthropic-ai/claude-code plugin validate "$dir" --strict
          done

  prose:
    name: markdown and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint:md
      - run: npm run spell

      # The manifests job runs the suite with no install, which is deliberate —
      # so the one test that needs real YAML parsers skips there and runs here.
      # It replays every frontmatter rule against yaml and js-yaml, in both
      # directions, which is what keeps the hand-rolled reader honest.
      - name: Cross-check the frontmatter rules against real YAML parsers
        run: npm test

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: docker://zricethezav/gitleaks:latest
        with:
          args: detect --source=/github/workspace --redact --verbose

      - name: Lint workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: Lint plugin shell scripts
        run: |
          shopt -s nullglob globstar
          scripts=(plugins/**/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "no plugin shell scripts"
            exit 0
          fi
          shellcheck "${scripts[@]}"

      - name: Byte-compile plugin Python scripts
        run: |
          shopt -s nullglob globstar
          files=(plugins/**/*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no plugin python scripts"
            exit 0
          fi
          python3 -m py_compile "${files[@]}"

  release-gate:
    name: version bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require a version bump and changelog entry
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          npm run check:version-bump

  # A tag is public and permanent, so it is cut only from a green main. The
  # release-gate job above has already refused any plugin change that reached
  # main without a version bump and a changelog entry, which is exactly the
  # material this job turns into a release.
  release:
    name: release
    needs: [manifests, prose, security]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The notes are the diff against the previous release, so the plugin
          # manifests at that tag have to be readable here.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # One release for the marketplace, tagged at this commit, with a section per
      # plugin whose version moved. Moved none, released nothing. Re-running this
      # workflow on main is safe: the plan is derived, so it is a no-op once the
      # release exists.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs --target "$GITHUB_SHA"
